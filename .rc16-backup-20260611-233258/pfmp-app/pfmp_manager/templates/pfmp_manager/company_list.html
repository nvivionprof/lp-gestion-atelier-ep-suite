{% extends 'pfmp_manager/base.html' %}{% block content %}<section class="panel"><div class="section-title"><h1>Entreprises</h1><a class="button" href="{% url 'pfmp_company_create' %}">Ajouter</a></div><form class="filters"><input name="q" value="{{ q }}" placeholder="Recherche nom, activité, ville"><select name="formation"><option value="">Toutes formations</option>{% for f in formations %}<option value="{{ f.code }}" {% if formation == f.code %}selected{% endif %}>{{ f.code }} — {{ f.nom }}</option>{% endfor %}</select><button>Filtrer</button></form><div class="cards-list">{% for c in companies %}<a class="company-card" href="{% url 'pfmp_company_detail' c.pk %}"><h3>{{ c.name }}</h3><p>{{ c.activity }}</p><small>{{ c.postal_code }} {{ c.city }} — {{ c.get_status_display }}</small></a>{% empty %}<p>Aucune entreprise.</p>{% endfor %}</div></section>{% endblock %}
