services:
  postgres:
    image: postgres:16-alpine
    container_name: lp-suite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lp_suite}
      POSTGRES_USER: ${POSTGRES_USER:-lp_suite_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lp_suite_net

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: lp-suite-reverse-proxy
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-9000}:80"
    volumes:
      - ./infra/nginx/lp-suite.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - lp-core
      - toolmag
      - safety-manager
      - system-manager
      - tp-manager
      - pedashop
      - pfmp-manager
    networks:
      - lp_suite_net

  lp-core:
    build:
      context: ./services/lp-core
    container_name: lp-core
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - postgres
    volumes:
      - lp_core_media:/app/media
      - lp_core_backups:/app/backups
    networks:
      - lp_suite_net

  toolmag:
    build:
      context: ./services/toolmag
    container_name: toolmag
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - postgres
      - lp-core
    networks:
      - lp_suite_net

  safety-manager:
    build:
      context: ./services/safety-manager
    container_name: safety-manager
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - postgres
      - lp-core
    networks:
      - lp_suite_net

  system-manager:
    build:
      context: ./services/system-manager
    container_name: system-manager
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - postgres
      - lp-core
    networks:
      - lp_suite_net

  tp-manager:
    build:
      context: ./services/tp-manager
    container_name: tp-manager
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - postgres
      - lp-core
    networks:
      - lp_suite_net

  pedashop:
    build:
      context: ./services/pedashop
    container_name: pedashop
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - postgres
      - lp-core
    networks:
      - lp_suite_net

  pfmp-manager:
    build:
      context: ./services/pfmp-manager
    container_name: pfmp-manager
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - postgres
      - lp-core
    networks:
      - lp_suite_net

networks:
  lp_suite_net:
    driver: bridge

volumes:
  postgres_data:
  lp_core_media:
  lp_core_backups:
