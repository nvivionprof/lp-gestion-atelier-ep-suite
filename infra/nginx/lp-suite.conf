# LP Gestion Atelier EP Suite
# Un seul point d’entrée public : :9000
# Routage interne par chemins applicatifs.

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    location /static/ {
        proxy_pass http://lp-core:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://lp-core:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /toolmag/ {
        proxy_pass http://toolmag:8000/toolmag/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /toolmag;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /safety/ {
        proxy_pass http://safety-manager:8000/safety/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /safety;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /systemes/ {
        proxy_pass http://system-manager:8000/systemes/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /systemes;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tp/ {
        proxy_pass http://tp-manager:8000/tp/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /tp;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pedashop/ {
        proxy_pass http://pedashop:8000/pedashop/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /pedashop;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pfmp/ {
        proxy_pass http://pfmp-manager:8000/pfmp/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /pfmp;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://lp-core:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
