<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LP Display Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card p-4 mx-auto" style="max-width:640px">
      {% if ok %}
        <h1 class="h3 text-success">Action envoyée</h1>
      {% else %}
        <h1 class="h3 text-danger">Action refusée</h1>
      {% endif %}
      <p>{{ message }}</p>
      <p class="text-muted small">LP Display Manager</p>
    </div>
  </div>
</body>
</html>
