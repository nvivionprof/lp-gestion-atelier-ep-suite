{% extends 'pedashop/base.html' %}
{% block content %}<h1>{{ consultation.code }} — consultation fournisseur</h1><form method="post">{% csrf_token %}<div class="card"><label>Commentaire</label><textarea name="commentaire" rows="2">{{ consultation.commentaire }}</textarea></div><div class="card table-wrap"><table><thead><tr><th>Désignation</th><th>Fabricant</th><th>Référence constructeur</th><th>Quantité souhaitée</th><th>Équivalence possible</th></tr></thead><tbody>{% for l in consultation.lignes.all %}<tr><td><input name="line_{{ l.id }}_designation" value="{{ l.designation }}"></td><td><input name="line_{{ l.id }}_fabricant" value="{{ l.fabricant }}"></td><td><input name="line_{{ l.id }}_reference_constructeur" value="{{ l.reference_constructeur }}"></td><td><input name="line_{{ l.id }}_quantite_souhaitee" value="{{ l.quantite_souhaitee }}" style="width:90px"></td><td><input type="checkbox" name="line_{{ l.id }}_equivalence_possible" {% if l.equivalence_possible %}checked{% endif %}></td></tr>{% endfor %}</tbody></table></div><div class="actions"><button class="btn primary" type="submit">Enregistrer</button><a class="btn orange" href="{% url 'pedashop_consultation_pdf' consultation.pk %}">Générer PDF</a></div></form>{% endblock %}
