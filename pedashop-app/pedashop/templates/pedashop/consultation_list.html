{% extends 'pedashop/base.html' %}
{% block content %}<h1>Consultations fournisseur</h1><div class="card table-wrap"><table><thead><tr><th>Code</th><th>Date</th><th>Magasin</th><th>Statut</th><th></th></tr></thead><tbody>{% for c in items %}<tr><td>{{ c.code }}</td><td>{{ c.date_creation }}</td><td>{{ c.magasin }}</td><td>{{ c.statut }}</td><td><a class="btn small" href="{% url 'pedashop_consultation_edit' c.pk %}">Éditer</a> <a class="btn small primary" href="{% url 'pedashop_consultation_pdf' c.pk %}">PDF</a></td></tr>{% empty %}<tr><td colspan="5">Aucune consultation.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
