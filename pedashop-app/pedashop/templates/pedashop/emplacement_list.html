{% extends 'pedashop/base.html' %}
{% block content %}<h1>Emplacements</h1><div class="actions"><a class="btn primary" href="{% url 'pedashop_emplacement_create' %}">Nouvel emplacement</a></div><div class="card table-wrap"><table><thead><tr><th>Magasin</th><th>Code</th><th>Nom</th><th>Actif</th></tr></thead><tbody>{% for i in items %}<tr><td>{{ i.magasin.code }}</td><td>{{ i.code }}</td><td>{{ i.nom }}</td><td>{{ i.actif|yesno:'Oui,Non' }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
