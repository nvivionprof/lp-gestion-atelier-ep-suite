{% extends 'pfmp_manager/base.html' %}{% block content %}<section class="panel"><div class="section-title"><h1>Périodes PFMP</h1><a class="button" href="{% url 'pfmp_period_create' %}">Créer</a></div><table><tr><th>Période</th><th>Dates</th><th>Classes</th><th>Statut</th></tr>{% for p in periods %}<tr><td>{{ p.title }}</td><td>{{ p.start_date }} → {{ p.end_date }}</td><td>{{ p.class_names }}</td><td>{{ p.get_status_display }}</td></tr>{% empty %}<tr><td colspan="4">Aucune période.</td></tr>{% endfor %}</table></section>{% endblock %}
