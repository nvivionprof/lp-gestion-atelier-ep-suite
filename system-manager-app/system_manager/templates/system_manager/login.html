{% extends 'system_manager/base.html' %}
{% block content %}
<section class="login-card panel">
  <h1>Connexion System Manager</h1>
  <p class="muted">Utilise ton identifiant LP Core synchronisé.</p>
  <form method="post" class="form-card">{% csrf_token %}
    <label>Identifiant ou code utilisateur</label><input type="text" name="username" required autofocus>
    <label>Mot de passe</label><input type="password" name="password" required>
    <button type="submit">Se connecter</button>
  </form>
</section>
{% endblock %}
