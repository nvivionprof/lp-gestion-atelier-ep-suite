services:
  web:
    build: .
    container_name: toolmag_web
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn toolmag.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
    expose:
      - "8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,toolmag.local,outillage.local"
      CSRF_TRUSTED_ORIGINS: "https://localhost,https://127.0.0.1,https://toolmag.local,https://outillage.local"
      SESSION_COOKIE_SECURE: "1"
      CSRF_COOKIE_SECURE: "1"

  nginx:
    image: nginx:1.27-alpine
    container_name: toolmag_nginx
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./media:/app/media:ro
      - ./staticfiles:/app/staticfiles:ro

  backup:
    build: .
    container_name: toolmag_backup
    command: sh -c "python manage.py backup_toolmag --loop --interval 86400 --retain-days 7"
    volumes:
      - .:/app
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,toolmag.local,outillage.local"
    depends_on:
      - web
    restart: unless-stopped
