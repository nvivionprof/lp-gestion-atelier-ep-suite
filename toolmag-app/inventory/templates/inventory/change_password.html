{% extends 'inventory/base.html' %}
{% block content %}
<h1>Changer mon mot de passe</h1>
<section class="panel">
  <p>Compte concerné : <strong>{{ person.first_name }} {{ person.last_name }}</strong> — {{ person.code }}</p>
  <form method="post" class="form">{% csrf_token %}
    {{ form.non_field_errors }}
    <div class="formgrid">
      {% for field in form %}
      <label>{{ field.label }}{{ field }}{% if field.errors %}<small class="error">{{ field.errors }}</small>{% endif %}</label>
      {% endfor %}
    </div>
    <button class="button primary" type="submit">Enregistrer le nouveau mot de passe</button>
  </form>
</section>
{% endblock %}
