{% extends 'sequence_manager/base.html' %}
{% block seq_title %}{{ title }}{% endblock %}
{% block seq_content %}

  {{ form.as_p }}
  <button class="btn" type="submit">Enregistrer</button>
</form>
{% endblock %}
