{% extends 'tp_manager/base.html' %}{% block content %}<h1>Configuration exports PDF — TP Manager</h1><div class="form-card"><form method="post">{% csrf_token %}<label>Identité élève dans les PDF</label><select name="identity_mode"><option value="anonymous" {% if identity_mode == 'anonymous' %}selected{% endif %}>Anonyme</option><option value="last_name" {% if identity_mode == 'last_name' %}selected{% endif %}>Nom seul</option><option value="first_name" {% if identity_mode == 'first_name' %}selected{% endif %}>Prénom seul</option><option value="full_name" {% if identity_mode == 'full_name' %}selected{% endif %}>Nom + prénom</option></select><p class="muted">Filtres prévus : période, classe, groupe, professeur, TP, thème, système, compétence, séquence.</p><button type="submit">Enregistrer</button></form></div>{% endblock %}
