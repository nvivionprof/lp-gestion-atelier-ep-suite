{% extends 'tp_manager/base.html' %}
{% block content %}
<section class="form-card">
  <h1>{{ title }}</h1>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ form.non_field_errors }}
    <div class="formgrid">
    {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="danger">*</span>{% endif %}</label>
        {{ field }}
        {% if field.help_text %}<p class="muted small">{{ field.help_text }}</p>{% endif %}
        {{ field.errors }}
      </div>
    {% endfor %}
    </div>
    <button type="submit">Enregistrer</button>
    <a class="button secondary" href="javascript:history.back()">Annuler</a>
  </form>
</section>
{% endblock %}
