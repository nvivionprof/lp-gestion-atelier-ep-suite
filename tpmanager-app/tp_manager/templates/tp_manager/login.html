{% extends 'tp_manager/base.html' %}
{% block content %}
<section class="form-card login-card">
  <h1>Connexion TP Manager</h1>
  <form method="post">{% csrf_token %}
    <label>Identifiant</label><input name="username" autocomplete="username" required>
    <label>Mot de passe</label><input type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Se connecter</button>
  </form>
</section>
{% endblock %}
